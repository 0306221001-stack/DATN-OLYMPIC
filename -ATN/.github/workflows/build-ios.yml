# Build app Thí sinh/Trọng tài cho iOS trên máy macOS của GitHub.
# File .ipa tạo ra CHƯA KÝ: cài lên iPhone bằng Sideloadly (Windows) với Apple ID.
# Chạy: tab Actions trên GitHub -> "Build iOS (IPA chưa ký)" -> Run workflow.
name: Build iOS (IPA chưa ký)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Địa chỉ máy chủ mặc định (để trống thì nhập trong app)"
        required: false
        default: ""

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Contests-Mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cài thư viện
        run: flutter pub get

      - name: Build iOS (không ký)
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            flutter build ios --release --no-codesign --dart-define=SERVER_URL="$SERVER_URL"
          else
            flutter build ios --release --no-codesign
          fi

      - name: Đóng gói thành .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OLYMPIC-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OLYMPIC-ios-unsigned
          path: Contests-Mobile-app/OLYMPIC-unsigned.ipa
          retention-days: 14
